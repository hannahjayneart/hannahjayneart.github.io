<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hannah's Handiworks — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=Caprasimo&family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#FFF8E7;font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  *{box-sizing:border-box}
  #root{min-height:100vh;display:flex}
  #root > div{flex:1;display:flex;align-items:center;justify-content:center}
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="#FFF8E7"/>
    <text x="100" y="100" text-anchor="middle" font-family="serif" font-style="italic" font-weight="900" font-size="42" fill="#E63E62">H</text>
    <text x="100" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2D2438" letter-spacing="2">SOON</text>
  </svg>
</template>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="confetti.jsx"></script>
<script type="text/babel">
  // Pick mobile layout based on viewport width.
  function ResponsiveComingSoon() {
    const [mobile, setMobile] = React.useState(window.innerWidth < 600);
    React.useEffect(() => {
      const r = () => setMobile(window.innerWidth < 600);
      window.addEventListener('resize', r);
      return () => window.removeEventListener('resize', r);
    }, []);
    return <ConfettiComingSoon mobile={mobile} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<ResponsiveComingSoon />);
</script>
</body>
</html>
