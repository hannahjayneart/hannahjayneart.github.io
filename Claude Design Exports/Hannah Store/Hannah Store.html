<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hannah Store — Design Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Caprasimo&family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&family=Space+Grotesk:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#f0eee9;font-family:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="confetti.jsx"></script>
<script type="text/babel">
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
  <DesignCanvas>
    <DCSection id="a" title="Confetti Pop" subtitle="Bright multicolor, hand-drawn, playful">
      <DCArtboard id="a-home" label="Homepage · Desktop" width={1280} height={2400}>
        <ConfettiHome />
      </DCArtboard>
      <DCArtboard id="a-home-mobile" label="Homepage · Mobile" width={390} height={2200}>
        <ConfettiHome />
      </DCArtboard>
      <DCArtboard id="a-collection" label="Collection · Desktop" width={1280} height={2200}>
        <ConfettiCollection />
      </DCArtboard>
      <DCArtboard id="a-collection-mobile" label="Collection · Mobile" width={390} height={2400}>
        <ConfettiCollection />
      </DCArtboard>
      <DCArtboard id="a-product" label="Product · Desktop" width={1280} height={2400}>
        <ConfettiProduct />
      </DCArtboard>
      <DCArtboard id="a-product-mobile" label="Product · Mobile" width={390} height={2600}>
        <ConfettiProduct />
      </DCArtboard>
      <DCArtboard id="a-coming" label="Coming Soon · Desktop" width={1280} height={700}>
        <ConfettiComingSoon />
      </DCArtboard>
      <DCArtboard id="a-coming-mobile" label="Coming Soon · Mobile" width={390} height={800}>
        <ConfettiComingSoon mobile={true} />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);
</script>
</body>
</html>
